name: PS5 test build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
    paths:
      - "ps5/**"
      - "pcsx2/**"
      - "3rdparty/**"
      - ".github/workflows/ps5-test-build.yml"

permissions:
  contents: read

concurrency:
  group: ps5-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  radv-eboot:
    name: Build PS5 test eboot (RADV)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out PS5SX2
        uses: actions/checkout@v4

      - name: Install LLVM 23 and build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl flex bison git             libclang-23-dev libclang-cpp23-dev libdrm-dev libelf-dev libexpat1-dev             libx11-dev libx11-xcb-dev libxdamage-dev libxext-dev libxfixes-dev             libxshmfence-dev libxxf86vm-dev libzstd-dev ninja-build pkg-config             python3-dev python3-mako python3-pip python3-setuptools python3-venv             rsync unzip wget zlib1g-dev
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 23
          sudo apt-get install -y clang-23 lld-23 llvm-23 llvm-23-dev llvm-23-tools libclang-rt-23-dev
          echo "CC=clang-23" >> "$GITHUB_ENV"
          echo "CXX=clang++-23" >> "$GITHUB_ENV"
          echo "LLD=ld.lld-23" >> "$GITHUB_ENV"
          echo "NM=llvm-nm-23" >> "$GITHUB_ENV"
          echo "HOST_CXX=clang++-23" >> "$GITHUB_ENV"
          echo "PS5_RADV_BUILTINS=$(clang++-23 -print-resource-dir)/lib/linux/libclang_rt.builtins-x86_64.a" >> "$GITHUB_ENV"

      - name: Install Meson and Ninja
        uses: astral-sh/setup-uv@v5
      - run: uv tool install meson ninja

      - name: Fetch pinned public PS5 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          fetch_commit() {
            local repo="$1" url="$2" revision="$3"
            mkdir -p "$repo"
            git -C "$repo" init -q
            git -C "$repo" remote add origin "$url"
            git -C "$repo" fetch --quiet --depth=1 origin "$revision"
            git -C "$repo" checkout --quiet --detach FETCH_HEAD
          }
          fetch_commit deps/PS5_Vulkan https://github.com/mihawk-99/PS5_Vulkan.git 3f3ee69
          fetch_commit deps/PS5_PayloadSDK https://github.com/mihawk-99/PS5_PayloadSDK.git 95c08f27386fc698f6bbe21dde3030140a41d10b
          fetch_commit deps/PS5_Mesa https://github.com/mihawk-99/PS5_Mesa.git 0b2d6d1a61d9bbf89cf8beb88a696144f67c61f8
          fetch_commit deps/ryml https://github.com/biojppm/rapidyaml.git 0cd25a1
          git -C deps/ryml submodule update --init --depth 1
          fetch_commit deps/glslang https://github.com/KhronosGroup/glslang.git 275822a
          fetch_commit deps/shaderc https://github.com/google/shaderc.git v2026.2

      - name: Build the pinned payload SDK and RADV driver
        shell: bash
        env:
          PS5_PAYLOAD_SDK_FORK: ${{ github.workspace }}/deps/PS5_PayloadSDK
          PS5_MESA_FORK: ${{ github.workspace }}/deps/PS5_Mesa
          BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          cd deps/PS5_Vulkan
          bash tools/setup-native-dependencies.sh
          MESON="$HOME/.local/bin/meson"             PATH="$HOME/.local/bin:$PATH"             bash tools/build-radv.sh release

      - name: Prepare PS5SX2 SDK and glslang
        shell: bash
        env:
          PS5SX2_DEPS: ${{ github.workspace }}/deps
        run: |
          set -euo pipefail
          cp -a deps/PS5_Vulkan/.deps/native/ps5-payload-sdk deps/sdk285
          cmake -S deps/glslang -B deps/glslang/build-ps5             -DCMAKE_TOOLCHAIN_FILE="$PS5SX2_DEPS/sdk285/toolchain/prospero.cmake"             -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=OFF -DENABLE_HLSL=OFF             -DENABLE_GLSLANG_BINARIES=OFF -DGLSLANG_TESTS=OFF
          cmake --build deps/glslang/build-ps5 --parallel 2

      - name: Build PS5SX2
        shell: bash
        env:
          PS5SX2_DEPS: ${{ github.workspace }}/deps
          PS5_PAYLOAD_SDK: ${{ github.workspace }}/deps/sdk285
          PS5_NATIVE_TOOL: ${{ github.workspace }}/deps/native-tools/ps5-native-tool
          PS5_RADV_ARCHIVE: ${{ github.workspace }}/deps/PS5_Vulkan/.deps/native/radv-release/lib/libvulkan_radeon.ps5.a
          PS5_RADV_PLATFORM: ${{ github.workspace }}/deps/PS5_Vulkan/.deps/native/ps5-payload-sdk/target/lib/libps5platform.a
          PS5_RADV_REV: 0b2d6d1a61d9
          PS5_RADV_BUILTINS: ${{ env.PS5_RADV_BUILTINS }}
          LLD: ld.lld-23
          NM: llvm-nm-23
          HOST_CXX: clang++-23
          LLD_EXTRA: --no-dynamic-linker -z nodynamic-undefined-weak
          ORBIS_BUILD_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'manual-test' }}
          ORBIS_TEST_BUILD: "1"
        run: |
          set -euo pipefail
          make -C ps5/coreorbis -f Makefile.vk -j2
          bash ps5/coreorbis/link-radv.sh
          test -s ps5/build-radv/app/eboot.bin
          sha256sum ps5/build-radv/app/eboot.bin

      - name: Package test artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ps5-test-build
          cp ps5/build-radv/app/eboot.bin ps5-test-build/eboot.bin
          cat > ps5-test-build/README.txt <<'EOF'
          PS5SX2 test build (RADV)
          This is a test eboot.bin, not a complete PS5 app package.
          Back up the installed app's eboot.bin, then replace it to test this build.
          Keep the installed sce_sys, assets, sce_module and Helper files in place.
          This experimental RADV build still needs on-console validation.
          EOF
          sha256sum ps5-test-build/eboot.bin > ps5-test-build/SHA256SUMS.txt

      - name: Upload test eboot
        uses: actions/upload-artifact@v4
        with:
          name: PS5SX2-test-eboot-radv
          path: ps5-test-build/
          if-no-files-found: error
          retention-days: 14
